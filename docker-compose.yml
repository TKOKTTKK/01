services:
  postgres:
    image: postgres:16-alpine
    container_name: stockapp-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-stockapp}
      POSTGRES_USER: ${DB_USERNAME:-stockapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockapp123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-stockapp} -d ${DB_NAME:-stockapp}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: stockapp-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: stockapp-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-stockapp}
      DB_USERNAME: ${DB_USERNAME:-stockapp}
      DB_PASSWORD: ${DB_PASSWORD:-stockapp123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-32byte-or-longer-secret-key!!}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-mock}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: stockapp-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
