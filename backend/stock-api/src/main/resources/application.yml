spring:
  application:
    name: stock-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockapp}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USERNAME:stockapp}
    password: ${DB_PASSWORD:stockapp123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      # 应用启动时自动执行 schema/data（均为幂等语句），本地裸跑无需手工建表
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      ssl:
        # 云平台的 Redis（如 Upstash 等常见免费方案）大多要求 TLS 连接，
        # 本地 docker-compose 起的 Redis 不需要，默认关闭，按需用环境变量打开
        enabled: ${REDIS_SSL_ENABLED:false}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-1234567890abcdef}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  sim:
    initial-cash: ${SIM_INITIAL_CASH:1000000}

market:
  data:
    provider: ${MARKET_DATA_PROVIDER:mock}

logging:
  level:
    root: info
    com.stockapp: info
