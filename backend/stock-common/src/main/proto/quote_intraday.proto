syntax = "proto3";

package stockapp.market;

option java_package = "com.stockapp.common.proto";
option java_multiple_files = true;
option java_outer_classname = "QuoteIntradayProto";

// ============================================================================
// 单只股票「实时行情 + 全天分时图」的二进制快照。
//
// 设计要点（对应重构需求里的“定点数 + 差值”优化）：
//
// 1. 所有价格/金额字段都用定点整数表示：真实值 * 100（分时价格是 2 位小数）
//    存进 int64/sint64，彻底不传浮点数，前后端按同一个 SCALE=100 换算，
//    避免了 float/double 在不同语言间的精度和序列化差异。
//
// 2. 分时点（points）里除第一个点外，价格/均价/成交额都编码成
//    “相对上一个点的差值”，而不是每个点各自的绝对值：
//    A 股同一分钟到下一分钟的价格波动通常很小（远小于价格绝对值本身），
//    差值在 Protobuf varint 编码下占用的字节数明显少于绝对值，
//    而且连续多个点如果差值相同/接近，产出的字节模式重复度更高，
//    对后续外层再做一次 gzip 压缩也更友好。
//    差值字段用 sint64（配合 zigzag 编码）而不是 int64，因为差值有正有负，
//    普通 int64 编码负数固定占 10 字节，sint64 才能让「小的负数」也编码成小整数。
//    第一个点的绝对值放在外层 QuoteIntradayVO 的 first_* 字段里，
//    解码时对 points 数组做一次累加（前缀和）即可还原出每个点的绝对值。
//
// 3. 成交量（volume）不做差值编码：相邻分钟的成交量本身波动幅度大、
//    正负号也不固定规律（不像价格那样围绕一条趋势线小幅抖动），
//    差值编码在这个字段上收益不明显，直接传絕对量整数更直观、解码也更简单。
//
// 4. minute_offset 用 0~239 的整数表示分时点在交易日内的位置，
//    不再传 "HH:mm" 这种字符串——按 A 股交易时段 9:30-11:30、13:00-15:00
//    各 120 分钟展开：0 = 09:30，119 = 11:29，120 = 13:00，239 = 14:59，
//    前后端各自用同一份换算规则（Java: TradingMinuteOffset，
//    TS: utils/tradingMinuteOffset.ts）还原成具体时间显示。
// ============================================================================

// 单个分时点（差值编码，需要配合父消息的 first_* 字段做前缀和还原）
message IntradayPointDelta {
  int32 minute_offset = 1;     // 距开盘 09:30 的分钟偏移，0~239
  sint64 price_delta = 2;      // 价格差 = 本点价格 - 上一点价格，定点 *100，zigzag 编码
  sint64 avg_price_delta = 3;  // 均价差 = 本点均价 - 上一点均价，定点 *100
  int64 volume = 4;            // 该分钟成交量（手），绝对值，不做差值
  sint64 amount_delta = 5;     // 成交额差 = 本点成交额 - 上一点成交额，定点 *100
}

// 单只股票的行情 + 分时快照
message QuoteIntradayVO {
  string code = 1;                    // 股票代码
  string name = 2;                    // 股票名称

  // ---- 实时行情，全部定点 *100（changePercent 例外，见下） ----
  int64 price = 3;                    // 现价
  int64 pre_close = 4;                // 昨收
  int64 change_amount = 5;            // 涨跌额
  int32 change_percent = 6;           // 涨跌幅：真实百分比 * 100（如 +1.23% -> 123），
                                       // 幅度本身量级小，用 int32 已足够，没必要 int64
  int64 volume = 7;                   // 成交量（手）
  int64 amount = 8;                   // 成交额（元），定点 *100
  int64 trade_time = 9;               // 行情时间，epoch millis
  bool mock = 10;                     // 是否模拟行情
  int64 open_price = 16;              // 开盘价
  int64 high_price = 17;              // 最高价
  int64 low_price = 18;               // 最低价

  // ---- 分时图：全天最多 240 点 ----
  int64 first_price = 11;             // points[0] 的绝对价格，定点 *100（差值链的起点）
  int64 first_avg_price = 12;         // points[0] 的绝对均价，定点 *100
  int64 first_amount = 13;            // points[0] 的绝对成交额，定点 *100
  int64 intraday_pre_close = 14;      // 分时图基准昨收，定点 *100（用于画均价线基准，
                                       // 与上面第 4 个字段 pre_close 数值上相同，
                                       // 独立出来是保留后端 IntradayVO 原本的字段边界，
                                       // 避免调用方误以为两者必然同源）
  int64 intraday_high = 19;           // 分时图当日最高价（IntradayVO.high 原样保留，
                                       // 不用前端从 points 里重新求 max——分时图的
                                       // "最高/最低"口径由后端统一计算，避免两边算法不一致）
  int64 intraday_low = 20;            // 分时图当日最低价
  repeated IntradayPointDelta points = 15;
}

// 顶层响应包装：Protobuf 没有泛型，Result<T> 这类通用返回结构在每个
// 接口各自定义一份具体的 xxxResponse，字段拍平，前端拿到就是强类型对象，
// 不需要再解一层 Any/泛型包装。
message QuoteIntradayResponse {
  int32 code = 1;       // 业务码，0 = 成功，非 0 = 失败（对应 ErrorCode）
  string message = 2;   // 提示信息
  QuoteIntradayVO data = 3;
}
